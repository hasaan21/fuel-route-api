[project]
name = "fuel-route-api"
version = "0.1.0"
description = "Cost-optimized fuel stops along a U.S. driving route"
authors = [{ name = "Fuel Route API" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "httpx==0.28.1",
    "pyproj==3.7.2",
    "python-dotenv==1.1.1",
    "shapely==2.1.2",
    "drf-spectacular (==0.30.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-django = "4.11.1"
pytest-cov = "7.0.0"
ruff = "0.13.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.coverage.run]
source = ["fuel_routes"]
omit = ["*/migrations/*"]
